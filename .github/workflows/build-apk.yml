name: build-apk

# 推送即出 APK。
#
# 为什么用 CI 而不是本地：Android build-tools 里的 aapt2 / zipalign 只有
# x86_64 的 ELF，跑在 arm64 机器（包括本项目的开发沙箱）上会直接
# "cannot execute binary file"。GitHub 的 ubuntu-latest 是 x64，正好。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # 仓库里只有 gradle-wrapper.properties：wrapper 的 jar 是二进制，
      # 在开发沙箱里生成不了。这里用 flutter create 生成一份完整模板，
      # 只把 wrapper 相关文件复制过来，绝不碰手写的 manifest 与 Kotlin。
      - name: 补齐 Gradle wrapper
        run: |
          flutter create --platforms=android --project-name exp_ledger /tmp/probe > /dev/null
          # 只补 jar 与启动脚本，不覆盖 properties：
          # 模板默认 Gradle 8.3，而 AGP 8.3.2 要求 >= 8.4，
          # 仓库里写的是 8.7，必须保留。
          mkdir -p android/gradle/wrapper
          cp /tmp/probe/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
          cp /tmp/probe/android/gradlew /tmp/probe/android/gradlew.bat android/
          chmod +x android/gradlew
          echo "--- wrapper 文件："
          ls -l android/gradle/wrapper/ android/gradlew
          echo "--- distributionUrl（应为 8.7）："
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "--- 确认手写文件没被动："
          head -3 android/app/src/main/AndroidManifest.xml
          grep -c "namespace" android/app/build.gradle.kts

      - name: 静态检查（不需要 SDK 那部分）
        run: |
          python3 tools/check_symbols.py
          python3 tools/schema_check.py

      - name: 预检
        run: bash tools/preflight.sh

      - name: 取依赖
        run: flutter pub get

      - name: 分析（error / warning 必须为 0）
        run: flutter analyze --no-fatal-infos

      - name: 数据层测试
        run: flutter test test/data/ --reporter compact

      - name: 打包 release
        run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: exp-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
