name: exp_ledger
description: "经验账本 — 把行为带来的突触变化画到一张长期图表上。"
publish_to: "none"
version: 1.2.0+9

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.1
  # zonedSchedule 需要 timezone；flutter_local_notifications 17 用的就是 0.9.x
  timezone: ^0.9.2
  intl: ^0.19.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Flutter 3.24.5 的 flutter_test 把 test_api 钉在 0.7.2，
  # test ^1.25.8 要求 0.7.3+，两者无解。降到 1.25.7 才能解析。
  test: ^1.25.7
  # 数据层测试要用真的 SQLite：纯 Dart 侧跑 sqlite3，不需要模拟器。
  # 测试里 `databaseFactory = databaseFactoryFfi` 之后，
  # sqflite 的全局 openDatabase 就走 ffi 实现。
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
